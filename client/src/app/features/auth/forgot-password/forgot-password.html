<h1 class="auth-title">Forgot your password?</h1>
<p class="auth-sub">No worries. Enter your email and we'll send you a reset link.</p>

@if (sentMessage(); as message) {
  <p class="alert alert--success" role="status">
    <ui-icon name="lucideMailCheck" />
    <span>{{ message }} The link expires in 30 minutes.</span>
  </p>
  <a class="btn btn--ghost btn--block" routerLink="/login">Back to log in</a>
} @else {
  @if (error(); as message) {
    <p class="alert alert--error" role="alert">
      <ui-icon name="lucideCircleAlert" />
      {{ message }}
    </p>
  }
  <form class="form-stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <ui-field
      label="Email"
      [error]="fieldError(form.controls.email, { required: 'Email is required' })"
    >
      <input
        uiInput
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="you@college.edu"
      />
    </ui-field>
    <button
      class="btn btn--primary btn--block"
      type="submit"
      [class.is-loading]="loading()"
      [disabled]="loading()"
    >
      {{ loading() ? 'Sending…' : 'Send reset link' }}
    </button>
  </form>
  <p class="auth-foot"><a routerLink="/login">Back to log in</a></p>
}
