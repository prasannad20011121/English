<h1 class="auth-title">Welcome back</h1>
<p class="auth-sub">Log in to keep your practice streak going.</p>

@if (showExpired()) {
  <p class="alert alert--info" role="status">
    <ui-icon name="lucideClock" />
    Your session ended. Please log in again.
  </p>
}
@if (error(); as message) {
  <p class="alert alert--error" role="alert">
    <ui-icon name="lucideCircleAlert" />
    {{ message }}
  </p>
}

<form class="form-stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <ui-field
    label="Email"
    [error]="fieldError(form.controls.email, { required: 'Email is required' })"
  >
    <input
      uiInput
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="you@college.edu"
    />
  </ui-field>

  <ui-field
    label="Password"
    [error]="fieldError(form.controls.password, { required: 'Password is required' })"
  >
    <input
      uiInput
      [type]="hidePassword() ? 'password' : 'text'"
      formControlName="password"
      autocomplete="current-password"
    />
    <button
      uiSuffix
      type="button"
      class="icon-btn"
      (click)="hidePassword.set(!hidePassword())"
      [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
    >
      <ui-icon [name]="hidePassword() ? 'lucideEye' : 'lucideEyeOff'" />
    </button>
  </ui-field>

  <div class="auth-row-end">
    <a routerLink="/forgot-password">Forgot password?</a>
  </div>

  <button
    class="btn btn--primary btn--block"
    type="submit"
    [class.is-loading]="loading()"
    [disabled]="loading()"
  >
    {{ loading() ? 'Logging in…' : 'Log in' }}
  </button>
</form>

<p class="auth-foot">New here? <a routerLink="/register">Create a free account</a></p>
